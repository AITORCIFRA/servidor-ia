server {
    listen       80;
    server_name  ai.cifraeducacion.com;

    location / {
        # Auth con Bearer token
        if ($http_authorization != "Bearer 1234567890") {
            return 401;
        }

        # OJO: "ollama" es el nombre del servicio en docker-compose
        # NO uses localhost aquí dentro de Docker
        proxy_pass         http://ollama:11434/;
        proxy_redirect     off;

        proxy_set_header   Host              ollama:11434;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        client_max_body_size        10m;
        client_body_buffer_size     128k;

        proxy_connect_timeout       90;
        proxy_send_timeout          90;
        proxy_read_timeout          90;

        proxy_buffer_size           4k;
        proxy_buffers               4 32k;
        proxy_busy_buffers_size     64k;
        proxy_temp_file_write_size  64k;

        # Necesario para streaming de tokens
        proxy_buffering             off;
    }
}